name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova and Dependencies
      run: |
        npm install -g cordova
        npm install

    - name: Create Cordova Project Components
      run: |
        mkdir -p www
        # Eger index.html we questions.js eýýäm bar bolsa, bular www papkasyna geçiriler
        cp index.html www/ || true
        cp questions.js www/ || true
        # Cordova platformasyny goşmak
        cordova platform add android

    - name: Build Android APK
      run: |
        cordova build android --release --no-telemetry

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: psychology-quiz-apk
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
        
