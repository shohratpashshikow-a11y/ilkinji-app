name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18' # Has durnukly wersiýa gaýtaryldy

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11' # Gradle 7.x bilen doly utgaşykly bolmagy üçin Java 11-e geçirildi

    # Gradle wersiýasyny Cordova-nyň köne wersiýalary üçin 7.6-a sabitleýäris
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    # Android gurşaw üýtgeýjilerini sazlamak
    - name: Set up Android Environment Variables
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    # Android lisenziýalaryny kabul etmek
    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # Taslama gerek bolan Android Build Tools wersiýasyny ýüklemek
    - name: Install Required Android Build Tools
      run: |
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

    # Cordova we garaşlylyklary gurnamak
    - name: Install Cordova and Dependencies
      run: |
        npm install -g cordova
        npm install

    # Taslama komponentlerini döretmek we Android platformasyny goşmak
    - name: Create Cordova Project Components
      run: |
        mkdir -p www
        cp index.html www/ || true
        cp questions.js www/ || true
        cordova platform add android

    # Islendik telefonda açylmagy üçin howpsuzlyk açaryny (Keystore) awtomatiki döretmek
    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias ${{ secrets.KEY_ALIAS }} -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} \
          -dname "CN=QuizApp, OU=Development, O=MyCompany, L=Ashgabat, S=Ahal, C=TM"

    # APK Faýlyny gurmak
    - name: Build Android APK
      run: |
        cordova build android --release --no-telemetry

    # Döredilen APK faýlyna resmi taýdan gol çekmek (Signing)
    - name: Sign APK
      run: |
        APK_PATH=$(find platforms/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore \
          -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }}
        
        # Zipalign arkaly APK faýlynyň işlemesini optimizasiýa etmek
        $ANDROID_SDK_ROOT/build-tools/33.0.2/zipalign -v 4 $APK_PATH ready-to-install.apk

    # Taýyn bolan, gol çekilen APK-y GitHub-a ýüklemek
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: psychology-quiz-signed-apk
        path: ready-to-install.apk
        
