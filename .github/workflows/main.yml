name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Gradle wersiýasyny Java 17 we Cordova bilen doly utgaşykly bolar ýaly 8.7-ä sabitleýäris
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    # Android gurşaw üýtgeýjilerini sazlamak
    - name: Set up Android Environment Variables
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    # Android lisenziýalaryny kabul etmek
    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # Cordova we garaşlylyklary gurnamak
    - name: Install Cordova and Dependencies
      run: |
        npm install -g cordova
        npm install

    # Taslama komponentlerini döretmek we Android platformasyny goşmak
    - name: Create Cordova Project Components
      run: |
        mkdir -p www
        cp index.html www/ || true
        cp questions.js www/ || true
        cordova platform add android

    # APK Gurmak (Ýalňyşlyk beren ädim - Gradle sazlamasyndan soň bärsi düzelmeli)
    - name: Build Android APK
      run: |
        cordova build android --release --no-telemetry

    # Taýyn bolan APK faýlyny GitHub-a ýüklemek
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: psychology-quiz-apk
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
        
